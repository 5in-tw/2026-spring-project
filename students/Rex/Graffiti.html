    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Sekuya&display=swap"
        rel="stylesheet">
</head>

<body class="dark-mode">
    <header>
        <div class="line center">
            <div class="big line">
                <img src="./images/avatar.png" width="200">
                <b>Rex</b>
            </div>
            <menu class="line">
                <a href="./">Home</a>
                <a href="./Dog.html">Dog</a>
                <a href="./Video.html">Video</a>
                <a href="Philosophy.html">Philosophy</a>
                <a href="Research.html">Research</a>
                <a href="Coding.html">Coding</a>
                <button id="color-mode-button">Light mode</button>
            </menu>
        </div>
        <ul class="center underline">
            <li class="tab"><a href="./Coding.html">About My Website</a><br /></li>
            <li class="tab"><a href="./Calculator.html">Calculator</a><br /></li>
            <li class="tab"><a href="./Graffiti.html">Graffiti</a><br /></li>
        </ul>
    </header>


    <main>
        <h1 class="center">Graffiti</h1>
        <div class="dog-picture">
            <div class="art-frame">
                <img class="art" src="./images/Original Picture/Dog picture(3).jpg" width="400">
                <canvas id="my-graffiti" width="400" height="400"></canvas>
            </div>
            <label>
                Tool:
                <select id="tool-select">
                    <option value="pen" selected>Pen</option>
                    <option value="eraser">Eraser</option>
                </select>
            </label>

            <label>
                color:
                <input type="color" value="#000099" id="color-input">
            </label>

            <label>
                size:
                <input type="range" min="1" max="100" value="10" id="size-input">
            </label>
            <details>
                <summary>More tools</summary>
                <p>Github is SLOW</p>
            </details>
        </div>
    </main>

    <footer>
        <div class="center">
            <p>2026/5/14</p>
        </div>
    </footer>
    <script src="./scripts/color-mode.js"></script>
    <script src="./scripts/graffiti.js" type="module"></script>
</body>
